<style>
:root{--bg:#f3f5f1;--panel:#fff;--fg:#1d2a22;--muted:#5d6b62;--line:#d6ddd5;--accent:#2f6b4a;--accent-fg:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--panel:#1b251f;--fg:#e6ede7;--muted:#9aa89f;--line:#2e3b33;--accent:#6fbf92;--accent-fg:#0f1a14;
--good:#7fd69b;--goodbg:#193a26;--care:#f0c36a;--carebg:#40330f;--no:#f09a9a;--nobg:#471c1c;--marker:#ff6b57;--rain:#7fb0d8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a15;--panel:#1b251f;--fg:#e6ede7;--muted:#9aa89f;--line:#2e3b33;--accent:#6fbf92;--accent-fg:#0f1a14;
--good:#7fd69b;--goodbg:#193a26;--care:#f0c36a;--carebg:#40330f;--no:#f09a9a;--nobg:#471c1c;--marker:#ff6b57;--rain:#7fb0d8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.5rem;margin:0}
.tag{color:var(--muted);font-size:.95rem;margin:2px 0 0}
.lang{display:flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--accent);padding:8px 12px;font:600 .9rem inherit;font-family:inherit;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}.stick{position:sticky;top:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:1.1rem;margin:0 0 10px}
.n{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.85rem;margin-right:8px}
.btn{font:600 1rem inherit;font-family:inherit;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--accent-fg);width:100%}
.btn.alt{background:transparent;color:var(--accent)}
.row{display:grid;gap:10px}
select,input[type=number]{font:inherit;font-size:1rem;min-height:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.seg{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:480px){.seg{grid-template-columns:repeat(3,1fr)}}
.seg button{font:inherit;min-height:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.mapbox{position:relative;width:100%;aspect-ratio:412/454;border-radius:10px;overflow:hidden;background:var(--line);touch-action:manipulation;cursor:crosshair}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid var(--marker);border-radius:50%;box-shadow:0 0 0 2px #fff;pointer-events:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 0}
.fact{background:var(--bg);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.fact span{font-size:.8rem;color:var(--muted)}
.where{margin:0 0 4px;font-size:1.02rem}
.crop{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.crop h3{margin:0 0 6px;font-size:1.15rem;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:.85rem;font-weight:700;border-radius:99px;padding:3px 12px}
.l0{background:var(--goodbg);color:var(--good)}.l1{background:var(--carebg);color:var(--care)}.l2{background:var(--nobg);color:var(--no)}
.crop ul{margin:6px 0 0;padding-left:1.2rem;display:grid;gap:4px}
.now{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:.95rem}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.mini{width:100%;height:auto;display:block}
table{border-collapse:collapse;font-size:.8rem;width:100%}td,th{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.fine{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
.lapse{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}.lapse input{width:5.5rem;min-height:40px}
</style>

/* ---------- geometry helpers ---------- */
const gx=lon=>(lon-X0)/D,gy=lat=>(Y0-lat)/D;
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function districtAt(lon,lat){for(const f of GEO)for(const p of f.polys){if(inRing(lon,lat,p[0])&&!p.slice(1).some(h=>inRing(lon,lat,h)))return f.name}return null}
function nearestTown(lat,lon){let b=null,bd=1e9;TOWNS.forEach(t=>{const dy=(t[1]-lat)*111.2,dx=(t[2]-lon)*111.2*Math.cos(lat*Math.PI/180),d=Math.hypot(dx,dy);if(d<bd){bd=d;b=t[0]}});return [b,bd]}
function centroid(f){let best=null,ba=0;for(const p of f.polys){const r=p[0];let a=0,cx=0,cy=0;for(let i=0,j=r.length-1;i<r.length;j=i++){const k=r[j][0]*r[i][1]-r[i][0]*r[j][1];a+=k;cx+=(r[j][0]+r[i][0])*k;cy+=(r[j][1]+r[i][1])*k}if(Math.abs(a)>ba){ba=Math.abs(a);best=[cx/(3*a),cy/(3*a)]}}return best}

/* ---------- map drawing ---------- */
function ramp(e){const s=[[200,[63,107,58]],[1500,[143,163,90]],[2800,[201,179,107]],[4000,[176,138,99]],[5500,[217,212,202]],[8500,[255,255,255]]];
 if(e<=s[0][0])return s[0][1];for(let i=1;i<s.length;i++)if(e<=s[i][0]){const a=s[i-1],b=s[i],t=(e-a[0])/(b[0]-a[0]);return a[1].map((v,k)=>v+(b[1][k]-v)*t)}return s[5][1]}
function drawMap(){
 const ctx=$("map").getContext("2d"),img=ctx.createImageData(CW,CH),d=img.data;
 for(let r=0;r<CH;r++)for(let c=0;c<CW;c++){const i=r*CW+c,e=elev[i],o=i*4;if(!e){d[o+3]=0;continue}
  const e1=elev[r*CW+Math.min(CW-1,c+1)]||e,e0=elev[r*CW+Math.max(0,c-1)]||e,n1=elev[Math.max(0,r-1)*CW+c]||e,s1=elev[Math.min(CH-1,r+1)*CW+c]||e;
  let sh=0.62+(-(e1-e0)/510*0.7-(s1-n1)/540*0.7)*0.55;sh=Math.max(.35,Math.min(1.15,sh));const col=ramp(e);
  d[o]=Math.min(255,col[0]*sh);d[o+1]=Math.min(255,col[1]*sh);d[o+2]=Math.min(255,col[2]*sh);d[o+3]=255}
 ctx.putImageData(img,0,0)}
function path(c,f,w,h){c.beginPath();for(const p of f.polys)for(const r of p){r.forEach((q,i)=>{const x=gx(q[0])/CW*w,y=gy(q[1])/CH*h;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath()}}
function halo(c,t,x,y,al,sz){c.textAlign=al;c.lineWidth=sz/4;c.strokeStyle="rgba(20,30,24,.85)";c.strokeText(t,x,y);c.fillStyle="#fff";c.fillText(t,x,y)}
function overlay(){
 const cv=$("ov"),dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth*dpr,h=cv.clientHeight*dpr;if(!w)return;cv.width=w;cv.height=h;
 const c=cv.getContext("2d"),u=w/412;c.lineJoin="round";
 c.fillStyle="rgba(18,26,21,.6)";c.fillRect(0,0,w,h);c.globalCompositeOperation="destination-out";GEO.forEach(f=>{path(c,f,w,h);c.fill()});c.globalCompositeOperation="source-over";
 const L=document.createElement("canvas");L.width=w;L.height=h;const l=L.getContext("2d");l.lineJoin="round";
 l.strokeStyle="#ffd24a";l.lineWidth=3.2*u;GEO.forEach(f=>{path(l,f,w,h);l.stroke()});l.globalCompositeOperation="destination-out";GEO.forEach(f=>{path(l,f,w,h);l.fill()});l.globalCompositeOperation="source-over";
 l.strokeStyle="rgba(255,255,255,.9)";l.lineWidth=1*u;l.setLineDash([4*u,3*u]);GEO.forEach(f=>{path(l,f,w,h);l.stroke()});l.setLineDash([]);
 const fs=Math.max(9,10.5*u);l.font="700 "+fs+"px system-ui,sans-serif";
 GEO.forEach(f=>{const q=centroid(f);halo(l,(lang=="ne"?pn(f.name.replace(" Sikkim","")):f.name.replace(" Sikkim","").toUpperCase()),gx(q[0])/CW*w,gy(q[1])/CH*h+(f.name=="South Sikkim"?32*u:0),"center",fs)});
 l.font="600 "+(fs*.9)+"px system-ui,sans-serif";
 TOWNS.forEach(t=>{if(t[4]===0)return;const x=gx(t[2])/CW*w,y=gy(t[1])/CH*h;l.beginPath();l.arc(x,y,2.4*u,0,6.283);l.fillStyle="#ffd24a";l.fill();l.lineWidth=1*u;l.strokeStyle="#1b251f";l.stroke();halo(l,pn(t[0]),x+(t[3]=="r"?5*u:-5*u),y+3.2*u,t[3]=="r"?"left":"right",fs*.9)});

/* ---------- advice engine ---------- */
function weatherCell(lat,lon){return WX[(lat>=27.25?"N":"S")+(lon>=88.4375?"E":"W")]}
function list(arr,f){const m=arr.map((v,i)=>f(v)?T[lang].mo[i]:null).filter(Boolean);return m.length?m.join(", "):tr("none")}
function phEff(){if(S.ph!=null&&!isNaN(S.ph))return S.ph;return S.soil==0?5.0:S.soil==1?6.0:null}
function evalCrop(id,c){
 const R=[];let lvl=0;const add=(sev,t)=>{R.push(t);lvl=Math.max(lvl,sev)};const e=Math.round(c.e),ph=c.ph;
 const rng={ginger:[300,1500,300,1500],cardamom:[1000,2000,600,2200],maize:[300,2200,300,2200]}[id];
 const within=c.e>=rng[0]&&c.e<=rng[1],edge=!within&&c.e>=rng[2]&&c.e<=rng[3]&&id=="cardamom";
 if(within)R.push(tr("altOk",{e,lo:rng[0],hi:rng[1]}));else if(edge)add(1,tr("altEdge",{e,lo:rng[0],hi:rng[1]}));else add(2,tr("altOut",{e,lo:rng[0],hi:rng[1]}));
 if(lvl==2)return {lvl,R,now:null};
 if(id!="cardamom"){if(c.s>30)add(1,tr("slVs",{s:c.s}));else if(c.s>=20)R.push(tr("slSt",{s:c.s}))}
 const cell=c.cell,adj=(cell.elev-c.e)/1000*S.lapse,tm=cell.tmean.map(v=>v+adj),tn=cell.tmin.map(v=>v+adj),tot=cell.rain.reduce((a,b)=>a+b,0);
 if(id=="ginger"){
  R.push(ph==null?tr("limeGu"):ph<6.0?tr("limeG"):tr("limeGok"));
  R.push(tr("warmG",{m:list(tm,v=>v>=15)}));R.push(tr("bedG"));R.push(tr("rotG"));
  const w={"East Sikkim":"w_bw","South Sikkim":"w_rot","West Sikkim":"w_sb"}[c.dist];if(w)R.push(tr("watch",{d:pn(c.dist),x:tr(w)}))}
 if(id=="cardamom"){
  R.push(tr("noLime"));if(ph!=null){if(ph>6.0)add(1,tr("phHi",{p:ph.toFixed(1)}));else if(ph<4.5)add(1,tr("phLo",{p:ph.toFixed(1)}))}
  if(tot<3000)R.push(tr("rainC",{r:Math.round(tot/10)*10}));
  const fr=list(tn,v=>v<2);R.push(fr==tr("none")?tr("nofrostC"):tr("frostC",{m:fr}));
  R.push(tr("varC",{v:vn(c.e<975?"Golsey, Seremna":c.e<=1500?"Sawney, Varlangey":"Ramsey (also steep slopes), Sawney, Varlangey")}));R.push(tr("chirke"))}
 if(id=="maize"){
  R.push(ph==null?tr("limeMu"):ph<5.5?tr("limeM"):tr("limeMok"));
  R.push(tr("nightM",{m:list(tn,v=>v>=15.6)}));R.push(tr("hailM"))}
 const m=new Date().getMonth()+1;let now="";
 if(id=="ginger")now=(m>=2&&m<=4)?tr("nGplant"):(m>=11||m==1)?tr("nGharv"):tr("nGgrow");
 if(id=="cardamom")now=(m==6||m==7)?tr("nCplant"):((m==9||m==10)&&c.e<1500)||((m==11||m==12)&&c.e>=1500)?tr("nCharv"):(m>=1&&m<=3)?tr("nCdry"):tr("nCgrow");
 if(id=="maize"){const low=c.e<1000,win=low?[2,3]:[3,4],mn=T[lang].mo;const inW=win.includes(m)||(low&&(m==7||m==8));
  now=inW?tr("nMsow"):tr("nMnext",{m:low?mn[1]+"–"+mn[2]+", "+mn[6]+"–"+mn[7]:mn[2]+"–"+mn[3]})}
 return {lvl,R,now}}

 const dist=districtAt(S.lon,S.lat),nt=nearestTown(S.lat,S.lon);
 const ok=col>=0&&row>=0&&col<CW&&row<CH&&elev[row*CW+col]>0;
 $("where").textContent=dist?tr("inDist",{d:pn(dist.replace(" Sikkim","")),t:pn(nt[0]),k:Math.max(1,Math.round(nt[1]))}):tr("out");
 if(!ok||!dist){$("facts").innerHTML="";$("pin").hidden=true;box.innerHTML='<p class="empty">'+(dist?tr("nodata"):tr("out"))+"</p>";$("wxd").hidden=true;return}
 const i=row*CW+col,e=elev[i],s=slope[i],a=asp[i]*2;
 $("pin").hidden=false;$("pin").style.left=((col+.5)/CW*100)+"%";$("pin").style.top=((row+.5)/CH*100)+"%";
 const dirs=T[lang].dirs;
 $("facts").innerHTML='<div class="fact"><b>'+e.toLocaleString("en-IN")+'</b><span>'+tr("elev")+'</span></div><div class="fact"><b>'+s+'°</b><span>'+tr("slope")+'</span></div><div class="fact"><b>'+(s<3?tr("flat"):dirs[Math.round(a/45)%8])+'</b><span>'+tr("faces")+'</span></div>';
 const cell=weatherCell(S.lat,S.lon),ctx={e,s,ph:phEff(),cell,dist};
 const res=["ginger","cardamom","maize"].map(id=>({id,r:evalCrop(id,ctx)})).sort((x,y)=>x.r.lvl-y.r.lvl);
 const none=res.every(x=>x.r.lvl==2);
 box.innerHTML=(none?'<p class="empty">'+tr("noneFit")+"</p>":"")+res.map(({id,r})=>'<div class="crop"><h3>'+tr(id)+'<span class="pill l'+r.lvl+'">'+tr("v"+r.lvl)+'</span></h3><ul>'+r.R.map(t=>"<li>"+t+"</li>").join("")+"</ul>"+(r.now?'<p class="now"><b>'+tr("now")+":</b> "+r.now+"</p>":"")+"</div>").join("");
 renderWx(cell,e)}

function renderWx(c,e){
 const d=$("wxd");d.hidden=false;$("t_wx").textContent=tr("wx");
 const adj=(c.elev-e)/1000*S.lapse,tn=c.tmin.map(v=>v+adj),tx=c.tmax.map(v=>v+adj),tm=c.tmean.map(v=>v+adj),mo=T[lang].mo;
 const mx=Math.max(...c.rain,100);let sv='<line x1="4" y1="100" x2="316" y2="100" stroke="var(--line)"/>';
 c.rain.forEach((v,i)=>{const x=8+i*26,h=v/mx*80;sv+='<rect x="'+x+'" y="'+(100-h)+'" width="16" height="'+h+'" fill="var(--rain)" rx="2"/>'});
 const y=t=>100-(t+10)/40*80;sv+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+tm.map((t,i)=>(16+i*26)+","+y(t).toFixed(1)).join(" ")+'"/>';
 const r=(n,a)=>"<tr><td>"+n+"</td>"+a.map(v=>"<td>"+Math.round(v)+"</td>").join("")+"</tr>";
 $("wxbody").innerHTML='<div class="lapse"><label for="lapse">'+tr("lapse")+'</label><input id="lapse" type="number" step="0.1" min="3" max="8" value="'+S.lapse+'"></div><svg class="mini" viewBox="0 0 320 110" role="img">'+sv+'</svg><div class="scroll"><table><tr><th></th>'+mo.map(m=>"<th>"+m.slice(0,3)+"</th>").join("")+"</tr>"+r(tr("night"),tn)+r(tr("day"),tx)+r(tr("rain"),c.rain)+'</table></div><p class="fine">'+tr("wxnote",{a:(adj>=0?"+":"")+adj.toFixed(1)})+"</p>";
 $("lapse").addEventListener("change",ev=>{const v=parseFloat(ev.target.value);if(v>=3&&v<=8){S.lapse=v;render()}})}

/* ---------- ui wiring ---------- */
function setPlace(lat,lon){S.lat=lat;S.lon=lon;render()}
function labels(){
 document.documentElement.lang=lang=="ne"?"ne":"en";
 $("tag").textContent=tr("tag");$("t_s1").textContent=tr("s1");$("t_s2").textContent=tr("s2");$("t_s3").textContent=tr("s3");$("gps").textContent=tr("gps");
 $("t_tap").textContent=tr("tap");$("ph").placeholder=tr("phPlace");$("ph").setAttribute("aria-label",tr("phPlace"));$("t_ph").textContent=tr("phHint");$("foot").textContent=tr("foot");
 const sel=$("town"),cur=sel.value;sel.innerHTML='<option value="">'+tr("town")+"</option>"+TOWNS.map((t,i)=>'<option value="'+i+'">'+pn(t[0])+"</option>").join("");sel.value=cur;
 $("seg").innerHTML=[0,1,2].map(i=>'<button data-i="'+i+'" aria-pressed="'+(S.soil==i&&S.ph==null)+'">'+tr("soil"+i)+"</button>").join("");
 $("lEn").setAttribute("aria-pressed",lang=="en");$("lNe").setAttribute("aria-pressed",lang=="ne");if(ready)overlay();render()}
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.soil=+b.dataset.i;S.ph=null;$("ph").value="";labels()});
$("ph").addEventListener("input",()=>{const v=parseFloat($("ph").value);S.ph=isNaN(v)?null:v;labels()});
$("town").addEventListener("change",e=>{if(e.target.value==="")return;const t=TOWNS[+e.target.value];setPlace(t[1],t[2])});
$("mapbox").addEventListener("click",ev=>{const r=$("mapbox").getBoundingClientRect();setPlace(Y0-(ev.clientY-r.top)/r.height*CH*D,X0+(ev.clientX-r.left)/r.width*CW*D);$("town").value=""});
$("gps").addEventListener("click",()=>{const m=$("gpsmsg");if(!navigator.geolocation){m.textContent=tr("gpsFail");return}m.textContent=tr("gpsWait");
 navigator.geolocation.getCurrentPosition(p=>{m.textContent="";setPlace(p.coords.latitude,p.coords.longitude)},()=>{m.textContent=tr("gpsFail")},{timeout:12000,maximumAge:600000})});
function setLang(l){lang=l;try{localStorage.setItem("ts_lang",l)}catch(e){}labels()}
$("lEn").onclick=()=>setLang("en");$("lNe").onclick=()=>setLang("ne");
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(overlay,150)});
labels();
(async()=>{try{
 const b64=await (await fetch("terrain.txt")).text(),bin=atob(b64.trim()),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
 const buf=await new Response(new Blob([by]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(),N=CW*CH;
 elev=new Uint16Array(buf,0,N);slope=new Uint8Array(buf,N*2,N);asp=new Uint8Array(buf,N*3,N);
 drawMap();overlay();ready=true;setPlace(27.33,88.61);$("town").value="0"
}catch(err){$("results").innerHTML='<p class="empty">Could not load map data. Reload to try again.</p>'}})();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
