/* ---------- geometry helpers ---------- */
const gx=lon=>(lon-X0)/D,gy=lat=>(Y0-lat)/D;
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function districtAt(lon,lat){for(const f of GEO)for(const p of f.polys){if(inRing(lon,lat,p[0])&&!p.slice(1).some(h=>inRing(lon,lat,h)))return f.name}return null}
function nearestTown(lat,lon){let b=null,bd=1e9;TOWNS.forEach(t=>{const dy=(t[1]-lat)*111.2,dx=(t[2]-lon)*111.2*Math.cos(lat*Math.PI/180),d=Math.hypot(dx,dy);if(d<bd){bd=d;b=t[0]}});return [b,bd]}
function centroid(f){let best=null,ba=0;for(const p of f.polys){const r=p[0];let a=0,cx=0,cy=0;for(let i=0,j=r.length-1;i<r.length;j=i++){const k=r[j][0]*r[i][1]-r[i][0]*r[j][1];a+=k;cx+=(r[j][0]+r[i][0])*k;cy+=(r[j][1]+r[i][1])*k}if(Math.abs(a)>ba){ba=Math.abs(a);best=[cx/(3*a),cy/(3*a)]}}return best}

/* ---------- map drawing ---------- */
function ramp(e){const s=[[200,[63,107,58]],[1500,[143,163,90]],[2800,[201,179,107]],[4000,[176,138,99]],[5500,[217,212,202]],[8500,[255,255,255]]];
 if(e<=s[0][0])return s[0][1];for(let i=1;i<s.length;i++)if(e<=s[i][0]){const a=s[i-1],b=s[i],t=(e-a[0])/(b[0]-a[0]);return a[1].map((v,k)=>v+(b[1][k]-v)*t)}return s[5][1]}
function drawMap(){
 base=document.createElement("canvas");base.width=CW;base.height=CH;const ctx=base.getContext("2d"),img=ctx.createImageData(CW,CH),d=img.data;
 for(let r=0;r<CH;r++)for(let c=0;c<CW;c++){const i=r*CW+c,e=elev[i],o=i*4;if(!e){d[o+3]=0;continue}
  const e1=elev[r*CW+Math.min(CW-1,c+1)]||e,e0=elev[r*CW+Math.max(0,c-1)]||e,n1=elev[Math.max(0,r-1)*CW+c]||e,s1=elev[Math.min(CH-1,r+1)*CW+c]||e;
  let sh=0.62+(-(e1-e0)/510*0.7-(s1-n1)/540*0.7)*0.55;sh=Math.max(.35,Math.min(1.15,sh));const col=ramp(e);
  d[o]=Math.min(255,col[0]*sh);d[o+1]=Math.min(255,col[1]*sh);d[o+2]=Math.min(255,col[2]*sh);d[o+3]=255}
 ctx.putImageData(img,0,0)}
function path(c,f,w,h){c.beginPath();for(const p of f.polys)for(const r of p){r.forEach((q,i)=>{const x=sx(q[0],w),y=sy(q[1],h);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath()}}
function halo(c,t,x,y,al,sz){c.textAlign=al;c.lineWidth=sz/4;c.strokeStyle="rgba(20,30,24,.85)";c.strokeText(t,x,y);c.fillStyle="#fff";c.fillText(t,x,y)}
function overlay(){
 const cv=$("ov"),dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth*dpr,h=cv.clientHeight*dpr;if(!w)return;cv.width=w;cv.height=h;
 const c=cv.getContext("2d"),u=w/412;c.lineJoin="round";
 c.fillStyle="rgba(18,26,21,.6)";c.fillRect(0,0,w,h);c.globalCompositeOperation="destination-out";GEO.forEach(f=>{path(c,f,w,h);c.fill()});c.globalCompositeOperation="source-over";
 const L=document.createElement("canvas");L.width=w;L.height=h;const l=L.getContext("2d");l.lineJoin="round";
 l.strokeStyle="#ffd24a";l.lineWidth=3.2*u;GEO.forEach(f=>{path(l,f,w,h);l.stroke()});l.globalCompositeOperation="destination-out";GEO.forEach(f=>{path(l,f,w,h);l.fill()});l.globalCompositeOperation="source-over";
 l.strokeStyle="rgba(255,255,255,.9)";l.lineWidth=1*u;l.setLineDash([4*u,3*u]);GEO.forEach(f=>{path(l,f,w,h);l.stroke()});l.setLineDash([]);
 const fs=Math.max(9,10.5*u);l.font="700 "+fs+"px system-ui,sans-serif";
 GEO.forEach(f=>{const q=centroid(f);halo(l,(lang!="en"?pn(f.name.replace(" Sikkim","")):f.name.replace(" Sikkim","").toUpperCase()),sx(q[0],w),sy(q[1],h)+(f.name=="South Sikkim"&&V.z<2?32*u:0),"center",fs)});
 l.font="600 "+(fs*.9)+"px system-ui,sans-serif";
 TOWNS.forEach(t=>{if(t[4]===0&&V.z<2)return;const x=sx(t[2],w),y=sy(t[1],h);l.beginPath();l.arc(x,y,2.4*u,0,6.283);l.fillStyle="#ffd24a";l.fill();l.lineWidth=1*u;l.strokeStyle="#1b251f";l.stroke();halo(l,pn(t[0]),x+(t[3]=="r"?5*u:-5*u),y+3.2*u,t[3]=="r"?"left":"right",fs*.9)});
 c.drawImage(L,0,0)}

/* ---------- advice engine ---------- */
function weatherCell(lat,lon){return WX[(lat>=27.25?"N":"S")+(lon>=88.4375?"E":"W")]}
function list(arr,f){const m=arr.map((v,i)=>f(v)?T[lang].mo[i]:null).filter(Boolean);return m.length?m.join(", "):tr("none")}
function phEff(){if(S.ph!=null&&!isNaN(S.ph))return S.ph;return S.soil==0?5.0:S.soil==1?6.0:null}
function evalCrop(id,c){
 const R=[],K=[];let lvl=0;const add=(sev,t)=>{R.push({t,w:1});lvl=Math.max(lvl,sev)},p=t=>R.push({t,w:0}),k=(type,t)=>K.push({type,t});const e=Math.round(c.e),ph=c.ph;
 const rng={ginger:[300,1500,300,1500],cardamom:[1000,2000,600,2200],maize:[300,2200,300,2200]}[id];
 const within=c.e>=rng[0]&&c.e<=rng[1],edge=!within&&c.e>=rng[2]&&c.e<=rng[3]&&id=="cardamom";
 if(within)p(tr("altOk",{e,lo:rng[0],hi:rng[1]}));else if(edge)add(1,tr("altEdge",{e,lo:rng[0],hi:rng[1]}));else add(2,tr("altOut",{e,lo:rng[0],hi:rng[1]}));
 if(lvl==2)return {lvl,R,K:[]};
 if(id!="cardamom"){if(c.s>30)add(1,tr("slVs",{s:c.s}));else if(c.s>=20)p(tr("slSt",{s:c.s}))}
 const cell=c.cell,adj=(cell.elev-c.e)/1000*S.lapse,tm=cell.tmean.map(v=>v+adj),tn=cell.tmin.map(v=>v+adj),tot=cell.rain.reduce((a,b)=>a+b,0);
 if(id=="ginger"){
  k("soil",ph==null?tr("limeGu"):ph<6.0?tr("limeG"):tr("limeGok"));
  p(tr("warmG",{m:list(tm,v=>v>=15)}));p(tr("bedG"));p(tr("rotG"));
  const w={"East Sikkim":"w_bw","South Sikkim":"w_rot","West Sikkim":"w_sb"}[c.dist];if(w)k("watch",tr("watch",{d:pn(c.dist),x:tr(w)}))}
 if(id=="cardamom"){
  let st=tr("noLime");if(ph!=null){if(ph>6.0){lvl=Math.max(lvl,1);st+=" "+tr("phHi",{p:ph.toFixed(1)})}else if(ph<4.5){lvl=Math.max(lvl,1);st+=" "+tr("phLo",{p:ph.toFixed(1)})}}
  k("soil",st);if(tot<3000)k("water",tr("rainC",{r:Math.round(tot/10)*10}));
  const fr=list(tn,v=>v<2);p(fr==tr("none")?tr("nofrostC"):tr("frostC",{m:fr}));
  p(tr("varC",{v:vn(c.e<975?"Golsey, Seremna":c.e<=1500?"Sawney, Varlangey":"Ramsey (also steep slopes), Sawney, Varlangey")}));k("watch",tr("chirke"))}
 if(id=="maize"){
  k("soil",ph==null?tr("limeMu"):ph<5.5?tr("limeM"):tr("limeMok"));
  p(tr("nightM",{m:list(tn,v=>v>=15.6)}));k("watch",tr("hailM"))}
 const m=new Date().getMonth()+1;let now="";
 if(id=="ginger")now=(m>=2&&m<=4)?tr("nGplant"):(m>=11||m==1)?tr("nGharv"):tr("nGgrow");
 if(id=="cardamom")now=(m==6||m==7)?tr("nCplant"):((m==9||m==10)&&c.e<1500)||((m==11||m==12)&&c.e>=1500)?tr("nCharv"):(m>=1&&m<=3)?tr("nCdry"):tr("nCgrow");
 if(id=="maize"){const low=c.e<1000,win=low?[2,3]:[3,4],mn=T[lang].mo;const inW=win.includes(m)||(low&&(m==7||m==8));
  now=inW?tr("nMsow"):tr("nMnext",{m:low?mn[1]+"–"+mn[2]+", "+mn[6]+"–"+mn[7]:mn[2]+"–"+mn[3]})}
 k("now",now);const ord={soil:0,now:1,water:2,watch:3};K.sort((a,b)=>ord[a.type]-ord[b.type]);
 const cal=[];for(let mm=1;mm<=12;mm++){let q="";
  if(id=="ginger")q=(mm>=2&&mm<=4)?"p":(mm>=11||mm==1)?"h":"g";
  if(id=="cardamom")q=(mm==6||mm==7)?"p":(c.e<1500?(mm==9||mm==10):(mm==11||mm==12))?"h":"g";
  if(id=="maize")q=(c.e<1000?[2,3,7,8]:[3,4]).includes(mm)?"p":"";
  cal.push(q)}

function render(){

 if(S.lat==null||!ready){box.innerHTML='<p class="empty">'+tr("empty")+"</p>";clearWx();return}
 const col=Math.floor(gx(S.lon)),row=Math.floor(gy(S.lat));
 const dist=districtAt(S.lon,S.lat),nt=nearestTown(S.lat,S.lon);
 const ok=col>=0&&row>=0&&col<CW&&row<CH&&elev[row*CW+col]>0;
 $("where").textContent=dist?tr("inDist",{d:pn(dist.replace(" Sikkim","")),t:pn(nt[0]),k:Math.max(1,Math.round(nt[1]))}):tr("out");
 if(!ok||!dist){$("facts").innerHTML="";pinOk=false;placePin();box.innerHTML='<p class="empty">'+(dist?tr("nodata"):tr("out"))+"</p>";clearWx();return}
 const i=row*CW+col,e=elev[i],s=slope[i],a=asp[i]*2;
 pinOk=true;placePin();
 const dirs=T[lang].dirs;
 $("facts").innerHTML='<div class="fact"><b>'+e.toLocaleString("en-IN")+'</b><span>'+tr("elev")+'</span></div><div class="fact"><b>'+s+'°</b><span>'+tr("slope")+'</span></div><div class="fact"><b>'+(s<3?tr("flat"):dirs[Math.round(a/45)%8])+'</b><span>'+tr("faces")+'</span></div>';
 const cell=weatherCell(S.lat,S.lon),ctx={e,s,ph:phEff(),cell,dist};
 const res=["ginger","cardamom","maize"].map(id=>({id,r:evalCrop(id,ctx)})).sort((x,y)=>x.r.lvl-y.r.lvl);
 const none=res.every(x=>x.r.lvl==2),kl={soil:tr("kSoil"),now:tr("now"),water:tr("kWater"),watch:tr("kWatch")};
 box.innerHTML=(none?'<p class="empty">'+tr("noneFit")+"</p>":"")+res.map(({id,r})=>'<div class="crop"><h3>'+tr(id)+'<span class="pill l'+r.lvl+'">'+tr("v"+r.lvl)+"</span></h3>"+r.K.map(x=>'<div class="key k-'+x.type+'"><span class="kl">'+kl[x.type]+"</span><span class=\"kt\">"+x.t+"</span></div>").join("")+calHtml(id,r.cal)+'<ul class="det">'+r.R.map(x=>'<li'+(x.w?' class="w"':"")+">"+(x.w?"⚠ ":"")+x.t+"</li>").join("")+"</ul></div>").join("");

 const lines=["Terraslope",$("where").textContent+" · "+tr("elev")+" "+Math.round(e)+", "+tr("slope")+" "+s+"°"];
 res.forEach(({id,r})=>{const so=r.K.find(x=>x.type=="soil");lines.push("• "+tr(id)+": "+tr("v"+r.lvl)+(so&&r.lvl<2?" — "+so.t:""))});lines.push(location.origin+location.pathname);
 const sh=$("share");sh.href="https://wa.me/?text="+encodeURIComponent(lines.join("\n"));sh.textContent=tr("share");sh.hidden=false;
 renderWx(cell,e)}

function clearWx(){$("share").hidden=true;$("wxbody").innerHTML='<p class="empty">'+tr("empty")+"</p>"}
function renderWx(c,e){
 $("t_wx").textContent=tr("wx");
 const adj=(c.elev-e)/1000*S.lapse,tn=c.tmin.map(v=>v+adj),tx=c.tmax.map(v=>v+adj),tm=c.tmean.map(v=>v+adj),mo=T[lang].mo;
 const mx=Math.max(...c.rain,100);let sv='<line x1="4" y1="100" x2="316" y2="100" stroke="var(--line)"/>';
 c.rain.forEach((v,i)=>{const x=8+i*26,h=v/mx*80;sv+='<rect x="'+x+'" y="'+(100-h)+'" width="16" height="'+h+'" fill="var(--rain)" rx="2"/>'});
 const y=t=>100-(t+10)/40*80;sv+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+tm.map((t,i)=>(16+i*26)+","+y(t).toFixed(1)).join(" ")+'"/>';
 const r=(n,a)=>"<tr><td>"+n+"</td>"+a.map(v=>"<td>"+Math.round(v)+"</td>").join("")+"</tr>";
 $("wxbody").innerHTML='<svg class="mini" viewBox="0 0 320 110" role="img">'+sv+'</svg><div class="scroll"><table><tr><th></th>'+mo.map(m=>"<th>"+m.slice(0,3)+"</th>").join("")+"</tr>"+r(tr("night"),tn)+r(tr("day"),tx)+r(tr("rain"),c.rain)+'</table></div><p class="fine">'+tr("wxnote",{a:(adj>=0?"+":"")+adj.toFixed(1)})+"</p>"+'<details class="adv"><summary>'+tr("adv")+'</summary><div class="lapse"><label for="lapse">'+tr("lapse")+'</label><input id="lapse" type="number" step="0.1" min="3" max="8" value="'+S.lapse+'"></div></details>';
 $("lapse").addEventListener("change",ev=>{const v=parseFloat(ev.target.value);if(v>=3&&v<=8){S.lapse=v;render()}})}

/* ---------- ui wiring ---------- */
function setPlace(lat,lon){S.lat=lat;S.lon=lon;saveState();render()}
function labels(){
 document.documentElement.lang=lang;$("t_wx").textContent=tr("wx");
 $("tag").textContent=tr("tag");$("t_s1").textContent=tr("s1");$("t_s2").textContent=tr("s2");$("t_s3").textContent=tr("s3");$("gps").textContent=tr("gps");
 $("t_tap").textContent=tr("tap");$("ph").placeholder=tr("phPlace");$("ph").setAttribute("aria-label",tr("phPlace"));$("t_ph").textContent=tr("phHint");$("foot").textContent=tr("foot");
 const sel=$("town"),cur=sel.value;sel.innerHTML='<option value="">'+tr("town")+"</option>"+TOWNS.map((t,i)=>'<option value="'+i+'">'+pn(t[0])+"</option>").join("");sel.value=cur;
 $("seg").innerHTML=[0,1,2].map(i=>'<button data-i="'+i+'" aria-pressed="'+(S.soil==i&&S.ph==null)+'">'+tr("soil"+i)+"</button>").join("");
 $("lEn").setAttribute("aria-pressed",lang=="en");$("lNe").setAttribute("aria-pressed",lang=="ne");$("lHi").setAttribute("aria-pressed",lang=="hi");$("zin").setAttribute("aria-label",tr("zIn"));$("zout").setAttribute("aria-label",tr("zOut"));$("zfit").setAttribute("aria-label",tr("zFit"));$("fb").hidden=!FORM_URL;if(FORM_URL){$("fb").href=FORM_URL;$("fb").textContent=tr("fb")}zn();if(ready)redraw();render()}
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.soil=+b.dataset.i;S.ph=null;$("ph").value="";saveState();labels()});
$("ph").addEventListener("input",()=>{const v=parseFloat($("ph").value);S.ph=isNaN(v)?null:v;saveState();labels()});
$("town").addEventListener("change",e=>{if(e.target.value==="")return;const t=TOWNS[+e.target.value];setPlace(t[1],t[2])});
const mb=$("mapbox");
function clampV(){const vw=1/V.z;V.x=Math.max(0,Math.min(1-vw,V.x));V.y=Math.max(0,Math.min(1-vw,V.y))}
function zn(){mb.classList.toggle("zoomed",V.z>1.05);$("zoomnote").hidden=V.z<=1.05;$("zoomnote").textContent=tr("zoomNote")}
function zoomAbout(z,fx,fy){z=Math.max(1,Math.min(8,z));const nx=V.x+fx/V.z,ny=V.y+fy/V.z;V.z=z;V.x=nx-fx/z;V.y=ny-fy/z;clampV();zn();schedule()}
function setView(z,cx,cy){V.z=Math.max(1,Math.min(8,z));V.x=cx-.5/V.z;V.y=cy-.5/V.z;clampV();zn();schedule()}
function zoomTo(lat,lon,z){setView(z,gx(lon)/CW,gy(lat)/CH)}
function pickAt(cx,cy){const r=mb.getBoundingClientRect(),nx=V.x+((cx-r.left)/r.width)/V.z,ny=V.y+((cy-r.top)/r.height)/V.z;$("town").value="";setPlace(Y0-ny*CH*D,X0+nx*CW*D)}
const pts=new Map();let moved=0,pinch=0;
mb.addEventListener("pointerdown",e=>{try{mb.setPointerCapture(e.pointerId)}catch(x){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(pts.size==2){const [a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
mb.addEventListener("pointermove",e=>{const p=pts.get(e.pointerId);if(!p)return;const r=mb.getBoundingClientRect(),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(pts.size==2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoomAbout(V.z*d/pinch,((a.x+b.x)/2-r.left)/r.width,((a.y+b.y)/2-r.top)/r.height);pinch=d;moved=99;return}
 moved+=Math.abs(dx)+Math.abs(dy);if(V.z>1.05&&moved>6){V.x-=dx/r.width/V.z;V.y-=dy/r.height/V.z;clampV();schedule()}});
mb.addEventListener("pointerup",e=>{const was=pts.size==1&&moved<=6;pts.delete(e.pointerId);pinch=0;if(was)pickAt(e.clientX,e.clientY)});
mb.addEventListener("pointercancel",e=>{pts.delete(e.pointerId);pinch=0});
mb.addEventListener("wheel",e=>{e.preventDefault();const r=mb.getBoundingClientRect();zoomAbout(V.z*(e.deltaY<0?1.25:.8),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
document.querySelector(".zbtns").addEventListener("pointerdown",e=>e.stopPropagation());document.querySelector(".zbtns").addEventListener("pointerup",e=>e.stopPropagation());
$("zin").onclick=()=>zoomAbout(V.z*1.6,.5,.5);$("zout").onclick=()=>zoomAbout(V.z/1.6,.5,.5);$("zfit").onclick=()=>setView(1,.5,.5);
$("gps").addEventListener("click",()=>{const m=$("gpsmsg");if(!navigator.geolocation){m.textContent=tr("gpsFail");return}m.textContent=tr("gpsWait");
 navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude,acc=Math.round(p.coords.accuracy||0);$("town").value="";setPlace(la,lo);
  if(!districtAt(lo,la)){m.textContent=tr("gpsOut");setView(1,.5,.5)}else if(acc>300){m.textContent=tr("gpsRough",{a:acc});zoomTo(la,lo,4)}else{m.textContent=tr("gpsOk",{a:acc});zoomTo(la,lo,3)}},
  ()=>{m.textContent=tr("gpsFail")},{enableHighAccuracy:true,timeout:15000,maximumAge:0})});

function setLang(l){lang=l;try{localStorage.setItem("ts_lang",l)}catch(e){}labels()}
$("lEn").onclick=()=>setLang("en");$("lNe").onclick=()=>setLang("ne");$("lHi").onclick=()=>setLang("hi");
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(redraw,150)});
labels();
(async()=>{try{
 const b64=await (await fetch("terrain.txt")).text(),bin=atob(b64.trim()),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
 const buf=await new Response(new Blob([by]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(),N=CW*CH;
 elev=new Uint16Array(buf,0,N);slope=new Uint8Array(buf,N*2,N);asp=new Uint8Array(buf,N*3,N);
 drawMap();ready=true;
 let sv=null;try{sv=JSON.parse(localStorage.getItem("ts_state")||"null")}catch(e){}
 if(sv&&typeof sv.lat=="number"&&typeof sv.lon=="number"){S.soil=[0,1,2].includes(sv.soil)?sv.soil:2;S.ph=typeof sv.ph=="number"?sv.ph:null;if(S.ph!=null)$("ph").value=S.ph;setPlace(sv.lat,sv.lon);
  const ti=TOWNS.findIndex(t=>Math.abs(t[1]-sv.lat)<1e-6&&Math.abs(t[2]-sv.lon)<1e-6);$("town").value=ti>=0?String(ti):"";labels()}
 else{setPlace(27.33,88.61);$("town").value="0"}
 redraw()
}catch(err){$("results").innerHTML='<p class="empty">Could not load map data. Reload to try again.</p>'}})();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
